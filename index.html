<script>
        let modoCadastro = false;
        let registroEmEdicaoId = null;
        let tamanhoFonteAtual = 100;

        window.addEventListener('DOMContentLoaded', () => {
            carregarTamanhoFonte();
            verificarSessao();
            gerarQRCodeLogin();
            carregarListaProfessorasNoLogin();
            verificarSeTemBiometriaSalva();
            atualizarSelectOpcoes();
            atualizarListaAlunosDinamica();
            atualizarPlanilhaGeral();
            atualizarDadosTopoPerfil();
            atualizarLista();
        });

        window.addEventListener('beforeunload', () => {
            fazerBackupAutomaticoSilencioso();
        });

        function alterarTamanhoFonte(variacao) {
            tamanhoFonteAtual += variacao;
            if (tamanhoFonteAtual < 80) tamanhoFonteAtual = 80;
            if (tamanhoFonteAtual > 150) tamanhoFonteAtual = 150;
            document.documentElement.style.fontSize = tamanhoFonteAtual + '%';
            localStorage.setItem('tamanho_fonte_app', tamanhoFonteAtual);
        }

        function carregarTamanhoFonte() {
            const fonteSalva = localStorage.getItem('tamanho_fonte_app');
            if (fonteSalva) {
                tamanhoFonteAtual = parseInt(fonteSalva);
                document.documentElement.style.fontSize = tamanhoFonteAtual + '%';
            }
        }

        function gerarQRCodeLogin() {
            const container = document.getElementById('qrcodeLogin');
            if (container && container.innerHTML.trim() === '') {
                new QRCode(container, {
                    text: "https://evertonltaborda1978-collab.github.io/controle-formatura/",
                    width: 120, height: 120, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        function obterChaveUsuario() {
            const cpfLogado = localStorage.getItem('usuario_logado_cpf') || 'padrao';
            return `_user_${cpfLogado}`;
        }

        function fazerBackupAutomaticoSilencioso() {
            const sufixo = obterChaveUsuario();
            const dados = localStorage.getItem(`caixa_formatura${sufixo}`);
            if (dados) localStorage.setItem(`backup_seguranca${sufixo}`, dados);
        }

        function carregarListaProfessorasNoLogin() {
            const select = document.getElementById('selectProfessoraRapido');
            let opcoesHtml = '<option value="">-- Escolher professora cadastrada --</option>';
            let encontrou = false;

            for (let i = 0; i < localStorage.length; i++) {
                const chave = localStorage.key(i);
                if (chave.startsWith('_user_')) {
                    const cpf = chave.replace('_user_', '');
                    const nomeProf = localStorage.getItem(`nome_professora${chave}`) || 'Professora';
                    const turmaProf = localStorage.getItem(`turma_professora${chave}`) || 'Turma';
                    opcoesHtml += `<option value="${cpf}">${nomeProf} (${turmaProf})</option>`;
                    encontrou = true;
                }
            }

            if (encontrou) {
                select.innerHTML = opcoesHtml;
                document.getElementById('containerSeletorProfessoras').classList.remove('hidden');
            } else {
                document.getElementById('containerSeletorProfessoras').classList.add('hidden');
            }

            const cpfSalvoMemoria = localStorage.getItem('cpf_memorizado_login');
            if (cpfSalvoMemoria && !modoCadastro) {
                document.getElementById('loginCpf').value = cpfSalvoMemoria;
                preencherSenhaAoDigitarCpf(cpfSalvoMemoria);
            }
        }

        function selecionarProfessoraRapida(cpf) {
            if (!cpf) return;
            document.getElementById('loginCpf').value = cpf;
            preencherSenhaAoDigitarCpf(cpf);
        }

        function preencherSenhaAoDigitarCpf(cpf) {
            const cpfLimpo = cpf.trim();
            if (!cpfLimpo) return;
            const sufixo = `_user_${cpfLimpo}`;
            const senhaSalva = localStorage.getItem(`cadastro_senha${sufixo}`) || '';
            document.getElementById('loginSenha').value = senhaSalva;
        }

        function verificarSessao() {
            const usuarioLogado = localStorage.getItem('usuario_logado_cpf');
            if (usuarioLogado) {
                document.getElementById('telaLogin').classList.add('hidden');
                document.getElementById('appPrincipal').classList.remove('hidden');
                document.getElementById('controlesFonte').classList.remove('hidden');
                atualizarDadosTopoPerfil();
            } else {
                document.getElementById('telaLogin').classList.remove('hidden');
                document.getElementById('appPrincipal').classList.add('hidden');
                document.getElementById('controlesFonte').classList.add('hidden');
                gerarQRCodeLogin();
                carregarListaProfessorasNoLogin();
            }
        }

        function atualizarDadosTopoPerfil() {
            const sufixo = obterChaveUsuario();
            const nomeProf = localStorage.getItem(`nome_professora${sufixo}`) || 'Professora';
            const turmaProf = localStorage.getItem(`turma_professora${sufixo}`) || 'Turma 5º Ano';
            document.getElementById('labelNomeProfessora').innerText = nomeProf;
            document.getElementById('labelTurmaTopo').innerText = turmaProf;
            document.getElementById('relatorioTurmaSub').innerText = `Controle de Pagamentos - Formatura (${turmaProf})`;
            document.getElementById('assinaturaProfessora').innerText = `Professora: ${nomeProf}`;
        }

        function abrirModalPerfil() {
            const sufixo = obterChaveUsuario();
            document.getElementById('inputModalNomeProf').value = localStorage.getItem(`nome_professora${sufixo}`) || '';
            document.getElementById('inputModalTurmaProf').value = localStorage.getItem(`turma_professora${sufixo}`) || '';
            document.getElementById('modalPerfil').classList.remove('hidden');
        }

        function fecharModalPerfil() { document.getElementById('modalPerfil').classList.add('hidden'); }

        function salvarPerfilModal() {
            const sufixo = obterChaveUsuario();
            const novoNome = document.getElementById('inputModalNomeProf').value.trim();
            const novaTurma = document.getElementById('inputModalTurmaProf').value.trim();
            if (novoNome) localStorage.setItem(`nome_professora${sufixo}`, novoNome);
            if (novaTurma) localStorage.setItem(`turma_professora${sufixo}`, novaTurma);
            fecharModalPerfil();
            atualizarDadosTopoPerfil();
            mostrarAviso('Sucesso', 'Perfil atualizado com sucesso!', '✅');
        }

        function alternarVisibilidadeSenha(idInput, idIcone) {
            const inputSenha = document.getElementById(idInput);
            const icone = document.getElementById(idIcone);
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text'; icone.innerText = '🙈';
            } else {
                inputSenha.type = 'password'; icone.innerText = '👁️';
            }
        }

        function verificarSeTemBiometriaSalva() {
            const biometriaCadastrada = localStorage.getItem('biometria_ativa_formatura');
            if (biometriaCadastrada && (window.PublicKeyCredential)) {
                document.getElementById('divBotaoBiometria').classList.remove('hidden');
            } else {
                document.getElementById('divBotaoBiometria').classList.add('hidden');
            }
        }

        async function cadastrarBiometriaSePossivel(cpf) {
            if (window.PublicKeyCredential) {
                try {
                    const publicKey = {
                        challenge: new Uint8Array(32),
                        rp: { name: "Secretaria Virtual Formatura" },
                        user: { id: Uint8Array.from(cpf, c => c.charCodeAt(0)), name: cpf, displayName: cpf },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        timeout: 60000, attestation: "direct"
                    };
                    const credential = await navigator.credentials.create({ publicKey });
                    if (credential) {
                        localStorage.setItem('biometria_ativa_formatura', 'true');
                        localStorage.setItem('usuario_biometria_cpf', cpf);
                    }
                } catch (e) { console.log("Biometria não configurada:", e); }
            }
        }

        async function entrarComBiometria() {
            if (window.PublicKeyCredential) {
                try {
                    const publicKey = { challenge: new Uint8Array(32), timeout: 60000, allowCredentials: [{ type: "public-key", id: new Uint8Array(32) }] };
                    await navigator.credentials.get({ publicKey }).catch(() => {});
                    const cpfSalvo = localStorage.getItem('usuario_biometria_cpf');
                    if (cpfSalvo) {
                        localStorage.setItem('usuario_logado_cpf', cpfSalvo);
                        verificarSessao();
                    } else {
                        mostrarAviso('Atenção', 'Nenhuma biometria vinculada. Entre com o CPF.', '⚠️');
                    }
                } catch (e) { mostrarAviso('Atenção', 'Não foi possível autenticar por biometria.', '⚠️'); }
            }
        }

        function alternarModoCadastro() {
            modoCadastro = !modoCadastro;
            const titulo = document.getElementById('subtituloLogin');
            const link = document.getElementById('linkModoCadastro');
            const btn = document.getElementById('btnAcaoLogin');
            const grupoCampos = document.getElementById('grupoCamposCadastro');
            const grupoConfirma = document.getElementById('grupoConfirmaSenha');
            const seletorRapido = document.getElementById('containerSeletorProfessoras');
            const inputNome = document.getElementById('cadastroNome');
            const inputTurma = document.getElementById('cadastroTurma');
            const inputConfirma = document.getElementById('loginSenhaConfirma');

            if (modoCadastro) {
                titulo.innerText = "Cadastre seu CPF, Nome e Turma"; link.innerText = "Já tem conta? Entrar"; btn.innerText = "Cadastrar e Entrar";
                seletorRapido.classList.add('hidden'); grupoCampos.classList.remove('hidden'); grupoConfirma.classList.remove('hidden');
                inputNome.setAttribute('required', 'true'); inputTurma.setAttribute('required', 'true'); inputConfirma.setAttribute('required', 'true');
                document.getElementById('loginSenha').value = '';
            } else {
                titulo.innerText = "Acesse com seu CPF para gerenciar sua turma"; link.innerText = "Ainda não tem conta? Cadastrar"; btn.innerText = "Entrar";
                seletorRapido.classList.remove('hidden'); grupoCampos.classList.add('hidden'); grupoConfirma.classList.add('hidden');
                inputNome.removeAttribute('required'); inputTurma.removeAttribute('required'); inputConfirma.removeAttribute('required');
                const cpfSalvoMemoria = localStorage.getItem('cpf_memorizado_login');
                if (cpfSalvoMemoria) { document.getElementById('loginCpf').value = cpfSalvoMemoria; preencherSenhaAoDigitarCpf(cpfSalvoMemoria); }
            }
        }

        async function realizarLogin(event) {
            event.preventDefault();
            const cpf = document.getElementById('loginCpf').value.trim();
            const senha = document.getElementById('loginSenha').value.trim();
            const sufixo = `_user_${cpf}`;
            const senhaSalva = localStorage.getItem(`cadastro_senha${sufixo}`);

            if (modoCadastro) {
                if (senhaSalva) { mostrarAviso('Erro', 'Este CPF já possui uma conta cadastrada. Faça login.', '❌'); return; }
                const senhaConfirma = document.getElementById('loginSenhaConfirma').value.trim();
                if (senha !== senhaConfirma) { mostrarAviso('Erro', 'As senhas não coincidem. Verifique por favor.', '❌'); return; }
                const nomeProf = document.getElementById('cadastroNome').value.trim();
                const turmaProf = document.getElementById('cadastroTurma').value.trim();
                if (!nomeProf || !turmaProf) { mostrarAviso('Atenção', 'Preencha o nome e a turma para o cadastro.', '⚠️'); return; }

                localStorage.setItem(`nome_professora${sufixo}`, nomeProf);
                localStorage.setItem(`turma_professora${sufixo}`, turmaProf);
                localStorage.setItem(`cadastro_senha${sufixo}`, senha);
                localStorage.setItem('usuario_logado_cpf', cpf);
                localStorage.setItem('cpf_memorizado_login', cpf);
                localStorage.setItem(`alunos_turma${sufixo}`, JSON.stringify([]));

                await cadastrarBiometriaSePossivel(cpf);
                fazerBackupAutomaticoSilencioso();
                mostrarAviso('Sucesso', 'Cadastro realizado com sucesso!', '🎉');
                verificarSessao(); atualizarListaAlunosDinamica(); atualizarPlanilhaGeral();
            } else {
                if (!senhaSalva) { mostrarAviso('Atenção', 'Este CPF não está cadastrado. Clique em "Ainda não tem conta? Cadastrar".', '⚠️'); return; }
                if (senha === senhaSalva) {
                    localStorage.setItem('usuario_logado_cpf', cpf);
                    localStorage.setItem('cpf_memorizado_login', cpf);
                    await cadastrarBiometriaSePossivel(cpf);
                    fazerBackupAutomaticoSilencioso();
                    verificarSessao(); atualizarListaAlunosDinamica(); atualizarPlanilhaGeral(); atualizarLista();
                } else { mostrarAviso('Erro', 'Senha incorreta. Verifique os dados.', '❌'); }
            }
        }

        function esqueciSenha() {
            const cpf = document.getElementById('loginCpf').value.trim();
            const sufixo = `_user_${cpf}`;
            const senhaSalva = localStorage.getItem(`cadastro_senha${sufixo}`);
            if (!cpf || !senhaSalva) { mostrarAviso('Atenção', 'Digite um CPF válido no campo acima e clique aqui.', '⚠️'); return; }
            mostrarAviso('Recuperação', `A senha para este CPF é: ${senhaSalva}`, '🔑');
        }

        function sairConta() {
            fazerBackupAutomaticoSilencioso(); localStorage.removeItem('usuario_logado_cpf');
            verificarSessao(); verificarSeTemBiometriaSalva(); carregarListaProfessorasNoLogin();
        }

        function abrirModalExcluirConta() {
            document.getElementById('inputCpfGerenciarConta').value = ''; document.getElementById('detalhesContaExcluir').innerHTML = '';
            document.getElementById('containerBotoesExclusao').classList.add('hidden'); document.getElementById('modalExcluirConta').classList.remove('hidden');
        }

        function fecharModalExcluirConta() { document.getElementById('modalExcluirConta').classList.add('hidden'); }

        function buscarContaParaGerenciar() {
            const cpfInput = document.getElementById('inputCpfGerenciarConta').value.trim();
            if (!cpfInput) { mostrarAviso('Atenção', 'Digite o CPF para localizar a conta.', '⚠️'); return; }
            const sufixo = `_user_${cpfInput}`;
            const nome = localStorage.getItem(`nome_professora${sufixo}`);
            const turma = localStorage.getItem(`turma_professora${sufixo}`);
            const container = document.getElementById('detalhesContaExcluir');
            if (!nome) {
                container.innerHTML = `<p class="text-rose-600 font-bold">Nenhuma conta encontrada com este CPF.</p>`;
                document.getElementById('containerBotoesExclusao').classList.add('hidden');
            } else {
                container.innerHTML = `<p><strong>Nome:</strong> ${nome}</p><p><strong>Turma:</strong> ${turma}</p><p><strong>CPF:</strong> ${cpfInput}</p>`;
                localStorage.setItem('cpf_para_exclusao_temporario', sufixo);
                document.getElementById('containerBotoesExclusao').classList.remove('hidden');
            }
        }

        function confirmarExclusaoConta() {
            const sufixo = localStorage.getItem('cpf_para_exclusao_temporario');
            if (sufixo) {
                localStorage.removeItem(`nome_professora${sufixo}`); localStorage.removeItem(`turma_professora${sufixo}`);
                localStorage.removeItem(`cadastro_senha${sufixo}`); localStorage.removeItem(`caixa_formatura${sufixo}`);
                localStorage.removeItem(`alunos_turma${sufixo}`); localStorage.removeItem('usuario_logado_cpf'); localStorage.removeItem('cpf_memorizado_login');
            }
            fecharModalExcluirConta(); mostrarAviso('Excluído', 'Conta removida com sucesso.', '🗑️'); setTimeout(() => location.reload(), 1500);
        }

        function obterAlunosTurma() {
            const sufixo = obterChaveUsuario();
            let lista = JSON.parse(localStorage.getItem(`alunos_turma${sufixo}`)) || [];
            const listaFixaDeAlunos = [
                "Arthur Carneiro Ferraz", "Davi de Goes Carneiro", "David Desplanches de Miranda",
                "Emanuelle Vitória de Oliveira", "Gustavo Henrique Ferreira Faria", "Gustavo Henrique Marcondes Galvão",
                "Heloisy Vitória dos Santos Freitas", "Ingridy Silva Lemes", "Isadora Martins Bueno",
                "João Lucas Cardoso dos Santos", "José Henrique Montevechio Cristo", "Letícia Vitória de Oliveira Betim",
                "Lorrany Marcelle Rocha de Camargo", "Lucas Ronaldo Jacumasso Ribas", "Luiza Lemes Faustino",
                "Luiza Vitória de Proença Miranda", "Maria Júlia Borges de Melo", "Matheus da Silva Santos",
                "Sabrina de Oliveira Mendes", "Steffiny Eduarda Pedroso dos Santos", "Yuri Matheus dos Santos Lessi"
            ];
            if (lista.length === 0) {
                lista = listaFixaDeAlunos;
                localStorage.setItem(`alunos_turma${sufixo}`, JSON.stringify(lista)); 
                localStorage.setItem('alunos_turma', JSON.stringify(lista));
            }
            return lista.sort((a, b) => a.localeCompare(b, 'pt-BR'));
        }

        function salvarAlunosTurma(lista) {
            const sufixo = obterChaveUsuario();
            lista.sort((a, b) => a.localeCompare(b, 'pt-BR'));
            localStorage.setItem(`alunos_turma${sufixo}`, JSON.stringify(lista)); 
            localStorage.setItem('alunos_turma', JSON.stringify(lista));
            atualizarListaAlunosDinamica(); 
            atualizarPlanilhaGeral();
        }

        function abrirModalGerenciarAlunos() { renderizarListaAlunosGerenciar(); document.getElementById('modalAlunos').classList.remove('hidden'); }
        function fecharModalGerenciarAlunos() { document.getElementById('modalAlunos').classList.add('hidden'); }

        function abrirModalImportar() {
            document.getElementById('textoListaAlunos').value = '';
            document.getElementById('modalImportarLista').classList.remove('hidden');
        }
        function fecharModalImportar() {
            document.getElementById('modalImportarLista').classList.add('hidden');
        }

        function processarListaColada() {
            const texto = document.getElementById('textoListaAlunos').value;
            if (!texto || !texto.trim()) {
                mostrarAviso('Atenção', 'Cole ao menos um nome na caixa de texto.', '⚠️');
                return;
            }
            let alunos = obterAlunosTurma();
            const linhas = texto.split('\n');
            let adicionados = 0;

            linhas.forEach(linha => {
                let nomeLimpo = linha.trim();
                nomeLimpo = nomeLimpo.replace(/^[•*\-\d\s.\)]+/, '').trim();
                if (nomeLimpo.length > 0) {
                    const jaExiste = alunos.some(a => a.toLowerCase() === nomeLimpo.toLowerCase());
                    if (!jaExiste) {
                        alunos.push(nomeLimpo);
                        adicionados++;
                    }
                }
            });

            salvarAlunosTurma(alunos);
            fecharModalImportar();
            renderizarListaAlunosGerenciar();
            mostrarAviso('Sucesso', `${adicionados} aluno(s) adicionado(s) em ordem alfabética!`, '✅');
        }

        function renderizarListaAlunosGerenciar() {
            const alunos = obterAlunosTurma();
            document.getElementById('listaAlunosGerenciar').innerHTML = alunos.map((aluno, index) => `
                <div class="flex justify-between items-center bg-white p-2 rounded border">
                    <span class="truncate max-w-[200px]">${aluno}</span>
                    <button onclick="removerAlunoTurma(${index})" class="text-red-500 hover:text-red-700 font-bold px-2 py-0.5 text-xs">Excluir</button>
                </div>
            `).join('');
        }

        function adicionarAlunoTurma() {
            const input = document.getElementById('novoAlunoInput'); const nome = input.value.trim();
            if (!nome) { mostrarAviso('Atenção', 'Digite o nome do aluno.', '⚠️'); return; }
            let alunos = obterAlunosTurma();
            if (alunos.some(a => a.toLowerCase() === nome.toLowerCase())) { mostrarAviso('Atenção', 'Este aluno já está na lista.', '⚠️'); return; }
            alunos.push(nome); salvarAlunosTurma(alunos); input.value = '';
            renderizarListaAlunosGerenciar(); mostrarAviso('Sucesso', 'Aluno adicionado à turma!', '✅');
        }

        function removerAlunoTurma(index) {
            let alunos = obterAlunosTurma(); alunos.splice(index, 1); salvarAlunosTurma(alunos);
            renderizarListaAlunosGerenciar(); mostrarAviso('Removido', 'Aluno retirado da turma.', '🗑️');
        }

        function calcularStatusAluno(alunoNome, todosLancamentos) {
            const META_PARCELA = 87.50;
            const lancamentos = todosLancamentos.filter(item => item.aluno ? item.aluno.toLowerCase() === alunoNome.toLowerCase() : false);
            
            let pagoP1 = 0;
            let pagoP2 = 0;

            lancamentos.forEach(item => {
                let val = 0;
                if (item.valor !== undefined && item.valor !== null && !isNaN(parseFloat(item.valor))) {
                    val = parseFloat(item.valor);
                } else {
                    val = extrairValorOpcao(item.tipoPagamento);
                }

                const opc = (item.tipoPagamento || '').toLowerCase();
                const ref = (item.ref || '').toLowerCase();

                if (opc.includes('à vista') || opc.includes('a vista') || opc.includes('175')) {
                    pagoP1 += META_PARCELA;
                    pagoP2 += META_PARCELA;
                } else if (ref === '1a_parcela' || opc.includes('1ª parcela')) {
                    pagoP1 += val;
                } else if (ref === '2a_parcela' || opc.includes('2ª parcela')) {
                    pagoP2 += val;
                } else {
                    if (pagoP1 < META_PARCELA) {
                        pagoP1 += val;
                    } else {
                        pagoP2 += val;
                    }
                }
            });

            const totalPago = pagoP1 + pagoP2;

            if (pagoP1 >= META_PARCELA && pagoP2 >= META_PARCELA) {
                return { grupo: 1, texto: "Quitado", totalPago, pagoP1, pagoP2 };
            }
            if (pagoP1 >= META_PARCELA && pagoP2 < META_PARCELA && pagoP2 === 0) {
                return { grupo: 2, texto: "1ª PAGA | 2ª Pendente", totalPago, pagoP1, pagoP2 };
            }
            if (pagoP1 > 0 && pagoP1 < META_PARCELA) {
                const faltaP1 = (META_PARCELA - pagoP1).toFixed(2).replace('.', ',');
                const pagoP1Fmt = pagoP1.toFixed(2).replace('.', ',');
                return { 
                    grupo: 4, 
                    texto: `🟡 PARCIAL (Pago R$ ${pagoP1Fmt} | Falta R$ ${faltaP1} da 1ª Parcela)`, 
                    totalPago, pagoP1, pagoP2 
                };
            }
            if (pagoP1 >= META_PARCELA && pagoP2 > 0 && pagoP2 < META_PARCELA) {
                const faltaP2 = (META_PARCELA - pagoP2).toFixed(2).replace('.', ',');
                const pagoP2Fmt = pagoP2.toFixed(2).replace('.', ',');
                return { 
                    grupo: 4, 
                    texto: `🟡 PARCIAL (1ª Paga | 2ª Parcial: Pago R$ ${pagoP2Fmt} | Falta R$ ${faltaP2})`, 
                    totalPago, pagoP1, pagoP2 
                };
            }

            return { grupo: 3, texto: "Pendente", totalPago: 0, pagoP1: 0, pagoP2: 0 };
        }

        function alunoEstaQuitado(nomeAluno) {
            const info = calcularStatusAluno(nomeAluno, obterDadosArmazenados());
            return info.grupo === 1;
        }

        function atualizarListaAlunosDinamica() {
            const alunos = obterAlunosTurma();
            const selectAluno = document.getElementById('nomeAluno');
            
            const alunosPendentes = alunos
                .filter(aluno => !alunoEstaQuitado(aluno))
                .sort((a, b) => a.localeCompare(b, 'pt-BR'));

            if (alunosPendentes.length === 0) {
                selectAluno.innerHTML = `<option value="">Todos os alunos quitaram a formatura! 🎉</option>`;
            } else {
                selectAluno.innerHTML = `<option value="">Selecione o aluno pendente...</option>` + 
                    alunosPendentes.map(aluno => `<option value="${aluno}">${aluno}</option>`).join('');
            }
        }

            "Dinheiro - À Vista (R$ 175,00)", "Dinheiro - 1ª Parcela (R$ 87,50)", "Dinheiro - 2ª Parcela (R$ 87,50)",

        ];

        function atualizarTextoPadrao() {
            const nome = document.getElementById('nomeAluno').value || '[Nome Aluno]';
            const selectTipo = document.getElementById('tipoPagamento');
            let tipo = selectTipo && selectTipo.value ? selectTipo.value : (opcoesPagamento[0] || 'Pagamento');
            const dataHoje = new Date().toLocaleDateString('pt-BR');

            if (tipo.includes('Personalizado') || tipo.includes('Valor Livre') || tipo.includes('customizado')) {
                const valInput = parseFloat(document.getElementById('valorCustomizado').value) || 0;
                const forma = document.getElementById('formaCustomizada').value;
                const refSelect = document.getElementById('refParcelaCustom');
                const refText = refSelect.options[refSelect.selectedIndex].text;
                document.getElementById('observacao').value = `Pago Parcial (${forma}) - R$ ${valInput.toFixed(2).replace('.', ',')} em ${dataHoje} - Ref: ${refText}`;

                document.getElementById('observacao').value = `Pago ${tipo} em ${dataHoje} - Aluno: ${nome}`;

        function obterDadosArmazenados() {
            const sufixo = obterChaveUsuario();
            const lançamentosNovos = JSON.parse(localStorage.getItem(`caixa_formatura${sufixo}`)) || [];
            if (lançamentosNovos.length === 0) {
                const lançamentosAntigos = JSON.parse(localStorage.getItem('caixa_formatura')) || [];
                if (lançamentosAntigos.length > 0) { localStorage.setItem(`caixa_formatura${sufixo}`, JSON.stringify(lançamentosAntigos)); return lançamentosAntigos; }
            }
            return lançamentosNovos;
        }

        let funcaoCallbackConfirmacao = null;

        function gerarNomePadronizado(nomeCompleto, tipoPagamento) {
            if (!nomeCompleto) return 'comprovante';
            const partes = nomeCompleto.trim().split(' ');
            return `${tipoPagamento.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase()}_${partes[0].toLowerCase()}_${(partes.length > 1 ? partes[partes.length - 1] : '').toLowerCase()}.pdf`;
        }

        function editarRegistro(id) {
            const dadosArmazenados = obterDadosArmazenados(); const item = dadosArmazenados.find(i => i.id === id); if (!item) return;
            
            const selectAluno = document.getElementById('nomeAluno');
            if (![...selectAluno.options].some(opt => opt.value === item.aluno)) {
                selectAluno.innerHTML += `<option value="${item.aluno}">${item.aluno}</option>`;
            }

            document.getElementById('nomeAluno').value = item.aluno; 
            document.getElementById('tipoPagamento').value = item.tipoPagamento;
            document.getElementById('observacao').value = item.observacao; 
            
            if (item.valorCustom !== undefined) {
                document.getElementById('valorCustomizado').value = item.valorCustom;
                document.getElementById('refParcelaCustom').value = item.refParcela || '1a_parcela';
            }

            document.getElementById('tipoPagamento').dispatchEvent(new Event('change'));
            registroEmEdicaoId = id;

            const btnSalvar = document.querySelector('#formPagamento button[onclick="prepararSalvamento()"]');
            btnSalvar.innerText = "Atualizar Lançamento"; 
            btnSalvar.classList.replace('bg-indigo-600', 'bg-amber-500'); 
            btnSalvar.classList.replace('hover:bg-indigo-700', 'hover:bg-amber-600');

            window.scrollTo({ top: 0, behavior: 'smooth' });

        function resetarFormularioAposEdicao() {
            registroEmEdicaoId = null; 
            document.getElementById('formPagamento').reset(); 
            document.getElementById('painelCustomizado').classList.add('hidden');
            atualizarListaAlunosDinamica();
            atualizarTextoPadrao();
            
            const btnSalvar = document.querySelector('#formPagamento button[onclick="prepararSalvamento()"]');
            btnSalvar.innerText = "Salvar Lançamento"; 
            btnSalvar.classList.replace('bg-amber-500', 'bg-indigo-600'); 
            btnSalvar.classList.replace('hover:bg-amber-600', 'hover:bg-indigo-700');
            document.getElementById('btnCancelarEdicao').classList.add('hidden');
        }

        function extrairValorOpcao(tipoPagamentoStr) {
            if (typeof tipoPagamentoStr === 'object' && tipoPagamentoStr !== null) {
                if (tipoPagamentoStr.valor !== undefined && !isNaN(parseFloat(tipoPagamentoStr.valor))) {
                    return parseFloat(tipoPagamentoStr.valor);
                }
                tipoPagamentoStr = tipoPagamentoStr.tipoPagamento || '';
            }
            const str = String(tipoPagamentoStr || '');
            if (str.includes('175')) return 175.00; 
            if (str.includes('87,50')) return 87.50; 
            const match = str.match(/R\$\s*([\d.,]+)/);
            if (match) {
                const val = parseFloat(match[1].replace('.', '').replace(',', '.'));
                if (!isNaN(val)) return val;
            }
            return 0.00;
        }

        function prepararSalvamento() {
            const nome = document.getElementById('nomeAluno').value.trim();
            if(!nome) { mostrarAviso('Atenção', 'Selecione o nome do aluno na lista.', '⚠️'); return; }
            let tipo = document.getElementById('tipoPagamento').value; 
            const obs = document.getElementById('observacao').value;
            const arquivoInput = document.getElementById('arquivoComprovante'); 
            const dadosArmazenados = obterDadosArmazenados();

            let valorNovoLancamento = 0;
            let refParcela = '';

            if (tipo.includes('Personalizado') || tipo.includes('Valor Livre') || tipo.includes('customizado')) {
                valorNovoLancamento = parseFloat(document.getElementById('valorCustomizado').value) || 0;
                refParcela = document.getElementById('refParcelaCustom').value;
                if (valorNovoLancamento <= 0) {
                    mostrarAviso('Atenção', 'Digite o valor pago no lançamento personalizado.', '⚠️');
                    return;
                }
            } else {
                valorNovoLancamento = extrairValorOpcao(tipo);
            }

            const totalJaPagoAluno = dadosArmazenados
                .filter(item => item.aluno.toLowerCase() === nome.toLowerCase() && item.id !== registroEmEdicaoId)
                .reduce((soma, item) => soma + (item.valor !== undefined ? item.valor : extrairValorOpcao(item.tipoPagamento)), 0);

            if ((totalJaPagoAluno + valorNovoLancamento) > 175.00) {
                mostrarAviso('Limite Ultrapassado', `Este aluno já possui R$ ${totalJaPagoAluno.toFixed(2).replace('.', ',')} lançados. Limite máximo é R$ 175,00.`, '❌'); 
                return;
            }

            if (arquivoInput.files.length > 0) {
                const arquivo = arquivoInput.files[0]; const leitor = new FileReader();
                leitor.onload = function(e) { 
                    salvarLancamentoFinal(nome, tipo, obs, gerarNomePadronizado(nome, tipo), e.target.result, valorNovoLancamento, refParcela); 
                };
                leitor.readAsDataURL(arquivo);
            } else {
                if (registroEmEdicaoId !== null) { 
                    const itemAntigo = dadosArmazenados.find(i => i.id === registroEmEdicaoId); 
                    salvarLancamentoFinal(nome, tipo, obs, itemAntigo.arquivo, itemAntigo.arquivoData, valorNovoLancamento, refParcela); 
                } else { 
                    salvarLancamentoFinal(nome, tipo, obs, 'Sem anexo (Dinheiro)', null, valorNovoLancamento, refParcela); 
                }
            }
        }

        function salvarLancamentoFinal(nome, tipo, obs, nomeArquivoGerado, dadosArquivoBase64, valorNumerico, refParcela) {
            document.getElementById('tituloModalConfirmacao').innerText = registroEmEdicaoId ? "Confirmar Edição" : "Confirmação de Lançamento";
            document.getElementById('conteudoResumoModal').innerHTML = `<p><strong>Aluno:</strong> ${nome}</p><p><strong>Forma:</strong> ${tipo}</p><p><strong>Valor:</strong> R$ ${valorNumerico.toFixed(2).replace('.', ',')}</p><p><strong>Status:</strong> ${obs}</p>`;
            document.getElementById('modalConfirmacao').classList.remove('hidden');

            funcaoCallbackConfirmacao = (confirmado) => {
                if(confirmado) {
                    let dadosArmazenados = obterDadosArmazenados();
                    if (registroEmEdicaoId !== null) {
                        const index = dadosArmazenados.findIndex(i => i.id === registroEmEdicaoId);
                        if (index !== -1) { 
                            dadosArmazenados[index] = { 
                                ...dadosArmazenados[index], 
                                aluno: nome, tipoPagamento: tipo, observacao: obs, 
                                arquivo: nomeArquivoGerado, arquivoData: dadosArquivoBase64,
                                valor: valorNumerico, ref: refParcela 
                            }; 
                        }
                    } else {
                        dadosArmazenados.push({ 
                            id: Date.now(), aluno: nome, tipoPagamento: tipo, observacao: obs, 
                            arquivo: nomeArquivoGerado, arquivoData: dadosArquivoBase64, 
                            valor: valorNumerico, ref: refParcela,
                            dataRegistro: new Date().toLocaleString('pt-BR') 
                        });
                    }
                    localStorage.setItem(`caixa_formatura${obterChaveUsuario()}`, JSON.stringify(dadosArmazenados)); 
                    fazerBackupAutomaticoSilencioso();
                    
                    atualizarLista(); 
                    atualizarPlanilhaGeral(); 
                    atualizarListaAlunosDinamica();
                    resetarFormularioAposEdicao(); 
                    mostrarAviso('Sucesso', 'Registro salvo!', '✅');
                }
            };
        }

        function visualizarArquivo(id) {
            const item = obterDadosArmazenados().find(i => i.id === id);
            if (!item || !item.arquivoData) { mostrarAviso('Atenção', 'Este registro não possui arquivo anexo.', 'ℹ️'); return; }
            document.getElementById('tituloVisualizador').innerText = `Comprovante: ${item.aluno}`;
            const container = document.getElementById('conteudoVisualizador');
            if (item.arquivoData.startsWith('data:image')) { container.innerHTML = `<img src="${item.arquivoData}" class="max-h-72 rounded shadow object-contain">`; } 
            else { container.innerHTML = `<iframe src="${item.arquivoData}" class="w-full h-72 rounded border"></iframe>`; }
            document.getElementById('modalVisualizador').classList.remove('hidden');
        }

        function atualizarLista() {
            const dadosArmazenados = obterDadosArmazenados(); 
            const containerPendentes = document.getElementById('tabelaLancamentos');
            const containerQuitados = document.getElementById('containerAlunosQuitados');
            const alunos = obterAlunosTurma();

            document.getElementById('contadorRegistros').innerText = `${dadosArmazenados.length} lançamentos`;

            if(dadosArmazenados.length === 0) {
                containerPendentes.innerHTML = `<p class="text-slate-400 text-center py-4">Nenhum lançamento registrado ainda.</p>`;
                containerQuitados.innerHTML = `<p class="text-slate-400 text-center py-2">Nenhum aluno quitado ainda.</p>`;

            }

            let htmlPendentes = '';
            let htmlQuitadosMap = {};

            alunos.forEach(aluno => {
                const pagamentosAluno = dadosArmazenados.filter(item => item.aluno.toLowerCase() === aluno.toLowerCase());
                if (pagamentosAluno.length > 0) {
                    const statusInfo = calcularStatusAluno(aluno, dadosArmazenados);
                    const quitado = statusInfo.grupo === 1;
                    
                    const blocoHtml = pagamentosAluno.map(item => `
                        <div class="border rounded-lg p-2.5 bg-slate-50 space-y-2 mb-2">
                            <div class="flex justify-between items-start">
                                <div>

                                    <p class="text-indigo-600 font-medium">${item.tipoPagamento} — <span class="${quitado ? 'text-emerald-700 font-bold' : 'text-amber-600 font-bold'}">${quitado ? 'QUITADO (R$ 175)' : 'Em aberto'}</span></p>
                                    <p class="text-slate-500 text-[10px]">${item.observacao}</p>
                                </div>
                                <div class="flex gap-3">

                                    <button onclick="excluirRegistro(${item.id})" class="text-red-500 hover:text-red-700 p-1 font-bold text-xs" title="Excluir">✕</button>

                            </div>
                        </div>
                    `).join('');

                    if (quitado) {
                        htmlQuitadosMap[aluno] = blocoHtml;
                    } else {
                        htmlPendentes += blocoHtml;
                    }
                }
            });

            containerPendentes.innerHTML = htmlPendentes || `<p class="text-slate-400 text-center py-4">Nenhum lançamento pendente no momento.</p>`;
            
            const chavesQuitadas = Object.keys(htmlQuitadosMap).sort((a, b) => a.localeCompare(b, 'pt-BR'));
            if (chavesQuitadas.length > 0) {
                containerQuitados.innerHTML = chavesQuitadas.map(a => htmlQuitadosMap[a]).join('');

                containerQuitados.innerHTML = `<p class="text-slate-400 text-center py-2 text-[11px]">Nenhum aluno com quitação completa (R$ 175) ainda.</p>`;

        function atualizarPlanilhaGeral() {

        // ENVIAR RELATÓRIO DO WHATSAPP COM NUMERAÇÃO CONTÍNUA DE 1 A 21
        function enviarRelatorioDiretora() {
            const alunos = obterAlunosTurma(); 
            const dadosArmazenados = obterDadosArmazenados();
            const sufixo = obterChaveUsuario();
            const turma = localStorage.getItem(`turma_professora${sufixo}`) || '5º C - 2026';
            const prof = localStorage.getItem(`nome_professora${sufixo}`) || 'ANGELA';

            const alunosProcessados = alunos.map(nome => {
                const info = calcularStatusAluno(nome, dadosArmazenados);
                return { nome, ...info };
            });

            // Separa em 4 grupos e aplica a ordem alfabética A-Z em cada um
            const quitados = alunosProcessados.filter(a => a.grupo === 1).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            const p1Quitada = alunosProcessados.filter(a => a.grupo === 2).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            const pendentes = alunosProcessados.filter(a => a.grupo === 3).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            const parciais  = alunosProcessados.filter(a => a.grupo === 4).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

            let contador = 1; // MANTÉM A NUMERAÇÃO CONTÍNUA DO INÍCIO AO FIM DO RELATÓRIO
            let corpoRelatorio = "";

            if (quitados.length > 0) {
                corpoRelatorio += "--- 🟢 QUITADOS ---\n";
                quitados.forEach(a => { corpoRelatorio += `${contador++}. ${a.nome} -> ${a.texto}\n`; });
                corpoRelatorio += "\n";
            }

            if (p1Quitada.length > 0) {
                corpoRelatorio += "--- 🟡 1ª PARCELA QUITADA ---\n";
                p1Quitada.forEach(a => { corpoRelatorio += `${contador++}. ${a.nome} -> ${a.texto}\n`; });
                corpoRelatorio += "\n";
            }

            if (pendentes.length > 0) {
                corpoRelatorio += "--- 🔴 PENDENTES ---\n";
                pendentes.forEach(a => { corpoRelatorio += `${contador++}. ${a.nome} -> ${a.texto}\n`; });
                corpoRelatorio += "\n";
            }

            if (parciais.length > 0) {
                corpoRelatorio += "--- 🟡 PAGAMENTOS PARCIAIS ---\n";
                parciais.forEach(a => { corpoRelatorio += `${contador++}. ${a.nome} -> ${a.texto}\n`; });
                corpoRelatorio += "\n";
            }

            const totalPrevisto = alunos.length * 175.00;
            const totalRecebido = alunosProcessados.reduce((acc, cur) => acc + cur.totalPago, 0);
            const valorPendente = totalPrevisto - totalRecebido;

            let relatorio = `       ESCOLA MUNICIPAL 31 DE MARÇO - E.I.E.F.
       CONTROLE DE PAGAMENTOS - FORMATURA

----------------------------------------
TURMA: ${turma}
Professora: ${prof}
Total de Formandos: ${alunos.length}
Valor por Estudante: R$ 175,00
----------------------------------------

STATUS DOS ALUNOS:

${corpoRelatorio.trim()}

----------------------------------------
RESUMO FINANCEIRO:
• Total Previsto: R$ ${totalPrevisto.toFixed(2).replace('.', ',')}
• Total Recebido: R$ ${totalRecebido.toFixed(2).replace('.', ',')}
• Valor Pendente: R$ ${valorPendente.toFixed(2).replace('.', ',')}
----------------------------------------

Relatório gerado digitalmente pela Secretária Virtual`;

            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(relatorio)}`, '_blank');
        }

        function gerarPDF() {
            document.getElementById('secaoFormulario').classList.add('hidden'); document.getElementById('secaoPlanilha').classList.remove('hidden');
            atualizarPlanilhaGeral(); setTimeout(() => window.print(), 300);
        }

        function alternarTela() {
            const formSec = document.getElementById('secaoFormulario'); const planilhaSec = document.getElementById('secaoPlanilha'); const btn = document.getElementById('btnAlternar');
            if(formSec.classList.contains('hidden')) { formSec.classList.remove('hidden'); planilhaSec.classList.add('hidden'); btn.innerText = "📊 Tabela"; } 
            else { formSec.classList.add('hidden'); planilhaSec.classList.remove('hidden'); btn.innerText = "📝 Novo Registro"; atualizarPlanilhaGeral(); }
        }

        function exportarWord() {
            const alunos = obterAlunosTurma(); const dados = obterDadosArmazenados(); let total = 0; const turma = localStorage.getItem(`turma_professora${obterChaveUsuario()}`) || '5º C';
            let linhas = '';
            alunos.forEach((aluno, index) => {
                const info = calcularStatusAluno(aluno, dados);
                total += info.totalPago;
                const p1 = info.pagoP1 >= 87.50;
                const p2 = info.pagoP2 >= 87.50;
                const pag = dados.filter(item => item.aluno.toLowerCase() === aluno.toLowerCase());
                linhas += `<tr style="height: 14pt;"><td style="border: 1px solid #000; text-align: center; font-size: 9.5pt;">${index + 1}</td><td style="border: 1px solid #000; font-size: 9.5pt;">${aluno}</td><td style="border: 1px solid #000; text-align: center; font-weight: bold; font-size: 9.5pt;">${p1 ? "PAGO" : info.pagoP1 > 0 ? "PARCIAL" : ""}</td><td style="border: 1px solid #000; text-align: center; font-weight: bold; font-size: 9.5pt;">${p2 ? "PAGO" : info.pagoP2 > 0 ? "PARCIAL" : ""}</td><td style="border: 1px solid #000; font-size: 9pt;">${pag.map(i => i.tipoPagamento).join(' | ') || "-"}</td></tr>`;
            });
            const blob = new Blob(['\ufeff' + `<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>@page Section1{size:841.7pt 595.3pt;mso-page-orientation:landscape;margin:1cm;}div.Section1{page:Section1;}body{font-family:Arial;font-size:9.5pt;line-height:1;}table{width:100%;border-collapse:collapse;}th{background-color:#f2f2f2;border:1px solid #000;font-size:9pt;font-weight:bold;}td{padding:1px 3px;}</style></head><body><div class="Section1"><h3 align="center">ESCOLA MUNICIPAL 31 DE MARÇO</h3><h4 align="center">CONTROLE DE PAGAMENTOS</h4><p align="center"><b>TURMA: ${turma} | FORMANDOS: ${alunos.length}</b></p><table><thead><tr><th style="width:5%;">Nº</th><th style="width:40%;">NOME</th><th style="width:12%;">1ª PARC</th><th style="width:12%;">2ª PARC</th><th style="width:31%;">FORMA / OBS</th></tr></thead><tbody>${linhas}</tbody></table><p><b>Total recebido:</b> R$ ${total.toFixed(2).replace('.', ',')}</p></div></body></html>`], { type: 'application/msword' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Controle_${turma.replace(/[^a-zA-Z0-9]/g, '_')}.doc`; document.body.appendChild(a); a.click(); a.remove();
        }

        function fazerBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obterDadosArmazenados()));
            const a = document.createElement('a'); a.href = dataStr; a.download = `backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove();
        }
    </script>
